<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t.scan_not_found }} — {{ site.site_brand }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  {% load static %}
  {% include "detection/_head_icons.html" %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=system-green-2" />
</head>
<body class="result-page">
{% include "detection/_navbar.html" %}

<div class="container-fluid result-container py-4 py-lg-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card result-panel border-0 text-center">
        <div class="card-body p-4 p-md-5">
          <div class="text-muted mb-3" style="font-size: 3rem;" aria-hidden="true">
            <i class="bi bi-search"></i>
          </div>
          <h1 class="h4 fw-bold mb-2">{{ t.scan_not_found }}</h1>
          <p class="text-muted mb-4">{{ not_found_msg }}</p>
          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="/?new_scan=1" class="btn btn-success">
              <i class="bi bi-camera me-2"></i>{{ t.scan_new_leaf }}
            </a>
            <a href="{% url 'scan_history' %}" class="btn btn-outline-secondary">
              <i class="bi bi-clock-history me-2"></i>{{ t.view_history }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
